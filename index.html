<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#15161a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CodeSearch Pocket</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-title" content="CodeSearch">
  <link rel="stylesheet" href="css/app.css?v=9c1dc1db1d">
</head>
<body data-look="classic">
  <div id="app" class="app">
    <!-- Kopf der Seite: TD-Seite, Kurs, Atlas -->
    <header class="topbar">
      <button class="tb" id="btn-td" title="TouchDesigner: Netz, Parameter, Timeline">TD</button>
      <span class="tb-title" id="tb-title">CodeSearch Pocket</span>
      <span class="tb-prog" id="tb-prog">0/0</span>
      <button class="tb" id="btn-keys" title="Tastenleiste">⌨</button>
      <button class="tb" id="btn-course" title="Kapitel">KURS</button>
      <button class="tb" id="btn-atlas" title="Nachschlagen">ATLAS</button>
      <button class="tb" id="btn-offline" title="Offline auf dem Handy speichern">⇩</button>
    </header>

    <!-- Das CodeSearch-Fenster -->
    <section class="cs" id="cs" aria-label="CodeSearch">
      <div class="cs-title" id="cs-title"></div>
      <div class="cs-scopes" id="cs-scopes"></div>
      <div class="cs-tabs" id="cs-tabs"></div>
      <div class="cs-context" id="cs-context"></div>
      <div class="cs-field">
        <span class="cs-gt" id="cs-mode-label">SEARCH</span>
        <input id="cs-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button class="cs-enter" id="cs-enter" title="Enter">⏎</button>
      </div>
      <div class="cs-filters" id="cs-filters"></div>
      <div class="cs-data" id="cs-data"></div>
      <div class="cs-record" id="cs-record"></div>
      <div class="cs-crumb" id="cs-crumb"></div>
      <div class="cs-groups" id="cs-groups"></div>
      <div class="cs-body" id="cs-body">
        <div class="cs-list" id="cs-list"></div>
        <div class="cs-split" id="cs-split" title="ziehen: Liste / Detail"></div>
        <aside class="cs-detail" id="cs-detail"></aside>
      </div>
      <div class="cs-status" id="cs-status"></div>
      <div class="cs-closed" id="cs-closed"><p id="cs-closed-why"></p><button id="btn-reopen">CodeSearch öffnen (Shift+K)</button></div>
    </section>

    <!-- Tastenleiste -->
    <div class="keys" id="keys"></div>

    <!-- Tour-Karte -->
    <section class="tour" id="tour">
      <div class="tour-grip" id="tour-grip"><span></span></div>
      <div class="tour-head" id="tour-head"></div>
      <div class="tour-body" id="tour-body"></div>
      <div class="tour-actions" id="tour-actions"></div>
    </section>
  </div>

  <!-- Ueberlagerungen -->
  <div class="layer" id="layer-td"></div>
  <div class="layer" id="layer-course"></div>
  <div class="layer" id="layer-atlas"></div>
  <div class="layer" id="layer-flowlens"></div>
  <div class="layer" id="layer-offline"></div>
  <div class="popup" id="popup"></div>
  <div class="quick" id="quick"></div>
  <div class="floats" id="floats"></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js?v=9c1dc1db1d"></script>
</body>
</html>
