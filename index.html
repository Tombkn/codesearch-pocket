<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CodeSearch Pocket</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=3">
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <span class="mark"></span>
      <span class="name">CODESEARCH</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-work">PLATZ</button>
      <button class="icon-btn" id="btn-play">PLAY</button>
      <button class="icon-btn" id="btn-map">KURS</button>
      <button class="icon-btn" id="btn-feat">ATLAS</button>
    </header>
    <div class="focus">
      FOCUS <b id="focus-name">BranchLab</b>
      <span class="stay">BLEIBT · <span id="prog-mini">0/459</span></span>
    </div>
    <div class="scopes" id="scopes">
      <button class="chip" data-scope="GLOBAL">GLOBAL</button>
      <button class="chip on" data-scope="NUR">NUR</button>
      <button class="chip" data-scope="REKURSIV">REKURSIV</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="field-row">
      <span class="gt">&gt;</span>
      <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="states   oder   gain">
      <button class="go" id="go">ENTER</button>
    </div>
    <section class="workspace">
      <div class="groups" id="groups"></div>
      <div class="list" id="list"></div>
      <aside class="detail" id="detail"></aside>
      <div class="labbar" id="labbar">
        <button data-lab="prepare">Vorbereiten</button>
        <button data-lab="fire">Fire</button>
        <button data-lab="mutate">Liste ändern</button>
        <button data-lab="notify">Dependency</button>
        <button data-lab="replace">Neue Liste</button>
        <button data-lab="clearChild">Child löschen</button>
        <button data-lab="expression">Gain EXPR</button>
        <button data-lab="constant">Gain CONST</button>
        <button data-lab="startup">Startwert</button>
        <button data-lab="runtimeReset">Runtime</button>
        <button data-lab="reinit">Reinit</button>
        <button data-lab="storageReset">Storage</button>
        <button data-lab="double">Doublefire</button>
        <span class="swatch-wrap"><span class="swatch" id="swatch"></span></span>
      </div>
    </section>
    <footer class="status">
      <span id="status-left">SEARCH</span>
      <span id="status-right"></span>
    </footer>
  </div>

  <section class="sheet" id="sheet">
    <div class="handle" id="handle"></div>
    <div class="sheet-head">
      <div>
        <div class="ch" id="sheet-ch">KAPITEL</div>
        <h2 id="sheet-title">Dein Arbeitsplatz</h2>
        <div class="peek" id="peek"></div>
      </div>
    </div>
    <div class="sheet-body">
      <div id="banner" class="banner hidden"></div>
      <div class="block"><div class="lbl">JETZT DU</div><p id="now"></p></div>
      <div class="block"><div class="lbl">WARUM</div><p id="why"></p></div>
      <div class="block"><div class="lbl">ERWARTET</div><p id="expected"></p></div>
      <div class="block muted"><div class="lbl">GRENZE</div><p id="limit"></p></div>
      <div class="block muted"><div class="lbl">GLOSSAR</div><p id="glossary"></p></div>
      <div class="block"><div class="lbl">PRÜFUNG</div><ul class="checks" id="checks"></ul></div>
    </div>
  </section>
  <div class="actions">
    <button id="btn-back">Zurück</button>
    <button id="btn-seen">Gesehen</button>
    <button class="good" id="btn-check">Prüfen</button>
    <button class="prime" id="btn-next">Weiter</button>
  </div>

  <section class="overlay" id="overlay-map">
    <header>
      <h1>KURS</h1>
      <span class="home-progress" id="map-progress"></span>
      <button class="close">Schließen</button>
    </header>
    <div class="body" id="map-list"></div>
  </section>

  <section class="overlay" id="overlay-feat">
    <header>
      <h1>WERKZEUGE</h1>
      <button class="close">Schließen</button>
    </header>
    <div class="body" id="feat-list"></div>
  </section>

  <script type="module" src="js/app.js?v=3"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
